name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Upload extension build
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-auditor-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run e2e
        env:
          HEADLESS: '1'
          WPA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
