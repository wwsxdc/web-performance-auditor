name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Build Firefox package
        run: node scripts/build-firefox.mjs
      - name: Upload extension build
        uses: actions/upload-artifact@v7
        with:
          name: web-performance-auditor-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Firefox build
        uses: actions/upload-artifact@v7
        with:
          name: web-performance-auditor-firefox
          path: dist-firefox/
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run e2e
        env:
          HEADLESS: '1'
          WPA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Accessibility audit (axe-core)
        run: npm run a11y
        env:
          HEADLESS: '1'
          WPA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Collector overhead budget
        run: npm run bench
        env:
          HEADLESS: '1'
          WPA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          WPA_PERF_RUNS: '5'

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e, perf]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - run: npm run verify:release
        env:
          HEADLESS: '1'
          WPA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: web-performance-auditor-release
          path: release/
          if-no-files-found: error
          retention-days: 14
